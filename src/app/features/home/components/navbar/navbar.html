<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <nav class="navbar__container" aria-label="Navegación principal">
    <a href="#inicio" class="navbar__brand" (click)="closeMenu()">
      <img
        class="navbar__logo"
        src="/images/logo/logo-clinica.png"
        alt="Logo Centro Oftalmológico Visión Clara"
        width="46"
        height="46"
      />
      <span class="navbar__brand-name">Centro Oftalmológico<br />Visión Clara</span>
    </a>

    <button
      type="button"
      class="navbar__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú de navegación"
      (click)="toggleMenu()"
    >
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
    </button>

    <div class="navbar__menu" [class.navbar__menu--open]="menuOpen()">
      <ul class="navbar__links">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="navbar__link"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
      <a routerLink="/login" class="btn btn--primary navbar__login" (click)="closeMenu()">
        Iniciar sesión
      </a>
    </div>
  </nav>
</header>
