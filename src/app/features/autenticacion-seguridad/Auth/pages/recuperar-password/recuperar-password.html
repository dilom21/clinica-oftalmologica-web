<main class="password-page">
  <section class="password-card" aria-labelledby="recuperar-title">
    <a routerLink="/login" class="password-back">← Volver al login</a>

    <h1 id="recuperar-title" class="password-title">Recuperar contrasena</h1>
    <p class="password-subtitle">
      Ingresa tu correo y te enviaremos un enlace para restablecer tu contrasena.
    </p>

    <form class="password-form" [formGroup]="recuperarForm" (ngSubmit)="onSubmit()" novalidate>
      <label class="password-label" for="email">Correo electronico</label>
      <input
        id="email"
        type="email"
        class="password-input"
        [class.password-input--error]="hasError('required') || hasError('email')"
        formControlName="email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
      />

      @if (emailErrorMessage()) {
        <p class="password-error" role="alert">{{ emailErrorMessage() }}</p>
      }

      @if (serverError()) {
        <p class="password-error" role="alert">{{ serverError() }}</p>
      }

      @if (successMessage()) {
        <p class="password-success" role="status">{{ successMessage() }}</p>
      }

      <button type="submit" class="password-submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar enlace de recuperacion' }}
      </button>
    </form>
  </section>
</main>
