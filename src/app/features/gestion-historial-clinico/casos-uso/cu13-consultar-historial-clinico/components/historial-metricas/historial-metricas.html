@if (metricas(); as datos) {
  <dl class="metricas" [class.metricas--cargando]="cargando()" aria-label="Resumen del historial">
    <div class="metricas__item">
      <span class="metricas__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v4M16 2v4M3 10h18"></path>
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        </svg>
      </span>
      <dt class="metricas__label">Consultas clínicas</dt>
      <dd class="metricas__valor">{{ datos.consultas }}</dd>
    </div>

    <div class="metricas__item">
      <span class="metricas__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"></path>
          <path d="M13 3h8v8"></path>
          <path d="M21 3 10 14"></path>
        </svg>
      </span>
      <dt class="metricas__label">Diagnósticos</dt>
      <dd class="metricas__valor">{{ datos.diagnosticos }}</dd>
    </div>

    <div class="metricas__item">
      <span class="metricas__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"></path>
        </svg>
      </span>
      <dt class="metricas__label">Antecedentes</dt>
      <dd class="metricas__valor">{{ datos.antecedentes }}</dd>
    </div>

    <div class="metricas__item metricas__item--fecha">
      <span class="metricas__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
      </span>
      <dt class="metricas__label">Fecha de apertura</dt>
      <dd class="metricas__valor metricas__valor--fecha">
        {{ formatearFecha(datos.fechaApertura) }}
      </dd>
    </div>
  </dl>
}
