<div class="navegacion-clinica" role="tablist" aria-label="Secciones del registro clínico">
  <svg class="navegacion-clinica__sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icono-clinico-diagnostico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </symbol>
      <symbol id="icono-clinico-tratamiento" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"></path>
        <path d="m8.5 8.5 7 7"></path>
      </symbol>
      <symbol id="icono-clinico-indicacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </symbol>
      <symbol id="icono-clinico-receta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1"></rect>
        <line x1="12" y1="11" x2="12" y2="17"></line>
        <line x1="9" y1="14" x2="15" y2="14"></line>
      </symbol>
      <symbol id="icono-clinico-examen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
    </defs>
  </svg>

  @for (seccion of secciones(); track seccion.id; let i = $index) {
    <button
      type="button"
      [class]="
        'navegacion-clinica__tab navegacion-clinica__tab--' +
        seccion.id +
        (activo() === seccion.id ? ' navegacion-clinica__tab--activa' : '')
      "
      role="tab"
      [id]="idTab(seccion.id)"
      [attr.aria-selected]="activo() === seccion.id"
      [attr.aria-controls]="idPanel(seccion.id)"
      [attr.tabindex]="activo() === seccion.id ? 0 : -1"
      (click)="seleccionar(seccion.id)"
      (keydown)="onKeydown($event, i)"
    >
      <span class="navegacion-clinica__icono" aria-hidden="true">
        <svg><use [attr.href]="'#icono-clinico-' + seccion.icono"></use></svg>
      </span>
      <span class="navegacion-clinica__etiqueta">{{ seccion.etiqueta }}</span>
      @if (seccion.contador !== null) {
        <span class="navegacion-clinica__contador">{{ seccion.contador }}</span>
      }
    </button>
  }
</div>
