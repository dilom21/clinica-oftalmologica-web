<ul class="tratamientos" role="list">
  @for (tratamiento of tratamientos(); track tratamiento.id) {
    <li class="tratamiento">
      <header class="tratamiento__cabecera">
        <h4 class="tratamiento__descripcion">{{ tratamiento.descripcion }}</h4>
        <span
          class="tratamiento__estado"
          [class.tratamiento__estado--activo]="tratamiento.estado"
          [class.tratamiento__estado--inactivo]="!tratamiento.estado"
        >
          {{ tratamiento.estado ? 'Activo' : 'Inactivo' }}
        </span>
      </header>

      <p class="tratamiento__rango">
        <span class="tratamiento__icono" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        {{ rangoFechas(tratamiento) }}
      </p>

      @if (tratamiento.observaciones) {
        <p class="tratamiento__observaciones">{{ tratamiento.observaciones }}</p>
      }
    </li>
  }
</ul>
