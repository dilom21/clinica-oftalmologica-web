@if (resultado(); as item) {
  <article class="resultado">
    <header class="resultado__cabecera">
      <span class="resultado__icono" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </span>
      <span class="resultado__etiqueta">Resultado #{{ item.id }}</span>
      <time class="resultado__fecha" [attr.datetime]="fechaDeResultado(item)">
        {{ fecha() }}
      </time>
    </header>

    <p class="resultado__valor">{{ item.resultado }}</p>

    @if (tieneArchivo()) {
      <a
        class="resultado__archivo"
        [href]="item.archivo_url"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
        {{ nombreArchivo(item.archivo_url || '') }}
      </a>
    }
  </article>
}
