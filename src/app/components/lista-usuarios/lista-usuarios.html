<div style="max-width: 700px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Lista de Usuarios</h2>
  
  <table style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background-color: #f4f4f4; border-bottom: 2px solid #ddd;">
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Correo</th>
        <th style="padding: 10px;">Rol</th>
        <th style="padding: 10px;">Estado</th>
        <th style="padding: 10px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios" style="border-bottom: 1px solid #eee;">
        <td style="padding: 10px;">{{ usuario.ID }}</td>
        <td style="padding: 10px;">{{ usuario.Correo }}</td>
        <td style="padding: 10px;">{{ usuario.Id_Rol }}</td>
        <td style="padding: 10px;">
          <span [style.color]="usuario.Estado ? 'green' : 'red'">
            {{ usuario.Estado ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <!-- BOTONES CONECTADOS -->
        <td style="padding: 10px; text-align: center;">
          
          <!-- BOTÓN AMARILLO ACTUALIZADO AQUÍ -->
          <button (click)="editar(usuario)" style="margin-right: 5px; padding: 5px 10px; background-color: #ffc107; border: none; border-radius: 3px; cursor: pointer;">
            Editar
          </button>
          
          <button (click)="desactivar(usuario.ID)" style="padding: 5px 10px; background-color: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer;">
            Dar de baja
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
